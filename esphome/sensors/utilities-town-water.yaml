#########################################################################
#
# Utility - Town Water Sensors
#
# Used to monitor town water supply, with a reed sensor connected to the
# meter, that has a rotating dial with a magnet inside that can be monitored.
#

substitutions:

  water_sensor_update_interval: 15s
  # Multiplier used in the flow rate calculation. Set to the number of litres 1 rotation of the meter equals.
  town_water_litres_per_pulse: "5.0"


########################## End of Substitutions #########################
#
# Restore input values from the values stored by their respective globals
#
esphome:
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(input_town_water_tariff1_rate).publish_state(id(town_water_tariff1_rate));
          id(input_town_water_tariff2_rate).publish_state(id(town_water_tariff2_rate));
          id(input_town_water_tariff1_daily_limit).publish_state(id(town_water_tariff1_daily_limit));
          id(input_town_water_annual_fee).publish_state(id(town_water_annual_fee));
          id(input_town_water_last_bill_reading).publish_state(id(town_water_last_bill_reading_kl));
          id(input_town_water_current_meter_reading).publish_state(id(town_water_current_meter_reading_l));

#########################################################################
#
# Web_server v3 Sort Groups - These substitutes are applied to overwrite the default ones supplied by the
# sensor specific template file, in this case the /sensors/hc-sr04-ultrasonic.yaml file.
#

web_server:
  sorting_groups:

    - id: group_utility_water_meter_sensors
      name: "Town Water - Sensors"
      sorting_weight: -43.1

    - id: group_consumption_town_water
      name: "Consumption - Town Water"
      sorting_weight: -39.1

    - id: group_configuration_town_water_tariffs
      name: "Configuration - Town Water Tariffs"
      sorting_weight: -35.1

    - id: group_configuration_town_water_meter_calibration
      name: "Configuration - Town Water Meter Calibration"
      sorting_weight: -34.1


#######################################################################################

globals:

  #  Globals for use with pulse meter, to allow storing and setting a base reading for water meter
  - id: global_town_water_total
    type: float
    restore_value: yes
#    initial_value: '0.0'  # When Factory Reset, return this value to '0.0'

  # Used by the text_sensor to reformat the Last Used Duration into hours/minutes/seconds.
  - id: last_formatted_duration_town_water
    type: std::string
    restore_value: no
    initial_value: '""'

  #
  # Town Water pricing / cost tracking. Tariff 1 applies up to the daily
  # limit (averaged over the whole billing period, since the meter is only
  # read once a quarter); everything above that limit is Tariff 2. Rates are
  # stored here in $/kL, but entered on the ¢/kL number inputs below
  # (converted in each input's set_action). Update these each quarter/bill.
  #
  - id: town_water_tariff1_rate
    type: float
    restore_value: true
    initial_value: "3.44"     # $/kL (344 ¢/kL)
  - id: town_water_tariff2_rate
    type: float
    restore_value: true
    initial_value: "4.66"     # $/kL (466 ¢/kL)
  - id: town_water_tariff1_daily_limit
    type: float
    restore_value: true
    initial_value: "0.80"     # kL/day
  # Annual connection/service fee, converted to a daily rate (÷365) for the
  # Daily/Quarter Connection Fee sensors below.
  - id: town_water_annual_fee
    type: float
    restore_value: true
    initial_value: "210.00"
  # One-off setup values - used by the "Town Water - Apply Meter Readings"
  # button to seed the quarter baseline and calibrate the lifetime L total.
  - id: town_water_last_bill_reading_kl
    type: float
    restore_value: true
    initial_value: "0"
  - id: town_water_current_meter_reading_l
    type: float
    restore_value: true
    initial_value: "0"

################################################################################
#
#  Binary Sensor - Used to internally determine if the tap is ON/OFF.
#

binary_sensor:
  - platform: template
    name: "Town Water - Tap State Sensor"
    id: town_water_tap_state_sensor
    lambda: |-
      return id(town_water_flow_rate).state > 0.01;
    on_press:
      then:
        - text_sensor.template.publish:
            id: town_water_tap_state
            state: "OPEN"
    on_release:
      then:
        - text_sensor.template.publish:
            id: town_water_tap_state
            state: "CLOSED"
    internal: true


################################################################################
#
#  Text Sensor - Used to publish if the tap is On
#

text_sensor:
  - platform: template
    name: "Town Water - Tap State"
    id: town_water_tap_state
    icon: "mdi:water-pump"
    update_interval: never
    web_server:
      sorting_group_id: group_utility_water_meter_sensors
      sorting_weight: 1


  - platform: template
    name: "Town Water - Last Use Duration"
    id: town_water_last_use_duration
    icon: mdi:timer-outline
    lambda: |-
      // Check if the sensor has a valid state
      if (!id(town_water_last_use_sensor).has_state()) {
        return std::string("Unknown");
      }

      int seconds = id(town_water_last_use_sensor).state;
      if (seconds < 0) {
        return std::string("Unknown");
      }

      // Format the duration
      int days = seconds / (24 * 3600);
      seconds = seconds % (24 * 3600);
      int hours = seconds / 3600;
      seconds = seconds % 3600;
      int minutes = seconds / 60;
      seconds = seconds % 60;

      std::string new_value;
      if (days > 3650) {
        new_value = "Starting up";
      } else if (days) {
        new_value = to_string(days) + "d " + to_string(hours) + "h " + to_string(minutes) + "m " + to_string(seconds) + "s";
      } else if (hours) {
        new_value = to_string(hours) + "h " + to_string(minutes) + "m " + to_string(seconds) + "s";
      } else if (minutes) {
        new_value = to_string(minutes) + "m " + to_string(seconds) + "s";
      } else {
        new_value = to_string(seconds) + "s";
      }
      // Only return a new value if it differs from the previous one
      if (new_value != id(last_formatted_duration_town_water)) {
        id(last_formatted_duration_town_water) = new_value;
        return new_value;
      }
      return {};
#    update_interval: 10s
    web_server:
      sorting_group_id: group_utility_water_meter_sensors
      sorting_weight: 4

#######################################################################################
#
# Number Inputs - Town Water tariffs, connection fee, and meter calibration.
#
number:
  - platform: template
    name: "Town Water - Tariff 1 Rate"
    id: input_town_water_tariff1_rate
    min_value: 1
    max_value: 10
    step: 0.01
    unit_of_measurement: "$/kL"
    optimistic: true
    mode: box
    icon: "mdi:currency-usd"
    set_action:
      then:
        - globals.set:
            id: town_water_tariff1_rate
            value: !lambda "return x;"
    web_server:
      sorting_group_id: group_configuration_town_water_tariffs
      sorting_weight: 1

  - platform: template
    name: "Town Water - Tariff 2 Rate"
    id: input_town_water_tariff2_rate
    min_value: 1
    max_value: 10
    step: 0.01
    unit_of_measurement: "$/kL"
    optimistic: true
    mode: box
    icon: "mdi:currency-usd"
    set_action:
      then:
        - globals.set:
            id: town_water_tariff2_rate
            value: !lambda "return x;"
    web_server:
      sorting_group_id: group_configuration_town_water_tariffs
      sorting_weight: 2

  - platform: template
    name: "Town Water - Tariff 1 Daily Limit"
    id: input_town_water_tariff1_daily_limit
    min_value: 0
    max_value: 10
    step: 0.01
    unit_of_measurement: "kL/day"
    optimistic: true
    mode: box
    icon: "mdi:stairs-up"
    set_action:
      then:
        - globals.set:
            id: town_water_tariff1_daily_limit
            value: !lambda "return x;"
    web_server:
      sorting_group_id: group_configuration_town_water_tariffs
      sorting_weight: 3

  - platform: template
    name: "Town Water - Annual Connection Fee"
    id: input_town_water_annual_fee
    min_value: 0
    max_value: 2000
    step: 0.01
    unit_of_measurement: "$"
    optimistic: true
    mode: box
    icon: "mdi:cash-minus"
    set_action:
      then:
        - globals.set:
            id: town_water_annual_fee
            value: !lambda "return x;"
    web_server:
      sorting_group_id: group_configuration_town_water_tariffs
      sorting_weight: 4

  - platform: template
    name: "Town Water - Meter Reading (Last Bill)"
    id: input_town_water_last_bill_reading
    min_value: 0
    max_value: 99999
    step: 1
    unit_of_measurement: "kL"
    optimistic: true
    mode: box
    icon: "mdi:counter"
    set_action:
      then:
        - globals.set:
            id: town_water_last_bill_reading_kl
            value: !lambda "return x;"
    web_server:
      sorting_group_id: group_configuration_town_water_meter_calibration
      sorting_weight: 1

  - platform: template
    name: "Town Water - Meter Reading (Current)"
    id: input_town_water_current_meter_reading
    min_value: 0
    max_value: 9999999
    step: 1
    unit_of_measurement: "L"
    optimistic: true
    mode: box
    icon: "mdi:counter"
    set_action:
      then:
        - globals.set:
            id: town_water_current_meter_reading_l
            value: !lambda "return x;"
    web_server:
      sorting_group_id: group_configuration_town_water_meter_calibration
      sorting_weight: 2

#######################################################################################
#
# Buttons - Manual quarter reset (real bill/meter-read periods land on
# irregular dates, so unlike gas there's no automatic day/month pattern to
# reset from), and a one-off setup action for starting mid-quarter.
#
button:
  - platform: template
    name: "Town Water - Quarter Reset"
    icon: "mdi:restart"
    on_press:
      then:
        - lambda: |-
            id(town_water_statistics_component).reset_quarter();
    web_server:
      sorting_group_id: group_configuration_town_water_meter_calibration
      sorting_weight: 3

  - platform: template
    name: "Town Water - Meter Readings (Apply)"
    icon: "mdi:calendar-refresh"
    on_press:
      then:
        - lambda: |-
            float current_reading_l = id(input_town_water_current_meter_reading).state;
            float last_bill_kl = id(input_town_water_last_bill_reading).state;
            float already_consumed_l = current_reading_l - (last_bill_kl * 1000.0f);
            if (already_consumed_l < 0) {
              already_consumed_l = 0;
            }

            // 1) Calibrate the lifetime L total to the physical reading.
            //    Must run BEFORE the global is updated below, since it
            //    reads the *old* total internally to work out how far
            //    today/week/month/year need to shift to stay unaffected by
            //    the jump.
            id(town_water_statistics_component).calibrate_total(current_reading_l);

            // 2) Actually move the lifetime total, and force "Town Water -
            //    Total" to publish it immediately.
            id(global_town_water_total) = current_reading_l;
            id(town_water_total).update();

            // 3) Seed the quarter baseline from the real consumption since
            //    the last bill. Runs *after* step 2 so it reads the newly
            //    calibrated total.
            id(town_water_statistics_component).reset_quarter(already_consumed_l);
    web_server:
      sorting_group_id: group_configuration_town_water_meter_calibration
      sorting_weight: 4

sensor:
  ################################################################################
  #
  # GPIO 17
  # Utility - Water Meter
  #

  # Used to update the COUNTER helper, that is triggered by an automation watching the pulse_counter
  - platform: pulse_counter
    name: "Town Water - Pulse Counter"
    id: town_water_pulse_counter
    pin:
      number: ${gpio_water_pin}
      allow_other_uses: true
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - multiply: ${town_water_litres_per_pulse} # Convert pulse count to liters
    internal: false
    web_server:
      sorting_group_id: group_utility_water_meter_sensors
      sorting_weight: 3


  - platform: pulse_meter
    name: "Town Water - Flow Rate"
    id: town_water_flow_rate
    unit_of_measurement: "L/min"
    state_class: measurement
    device_class: volume_flow_rate
    icon: "mdi:pump"
    accuracy_decimals: 2
    pin:
      number: ${gpio_water_pin}
      allow_other_uses: true
      inverted: true
      mode:
        input: true
        pullup: true
    internal_filter_mode: PULSE
    internal_filter: 100ms
    timeout: 90s #3min
    filters:
      - multiply: ${town_water_litres_per_pulse}  # Each pulse equals 5 liters. The water counter 'helper' in Home Assistant must still be set to 'step size' = 5.
    web_server:
      sorting_group_id: group_utility_water_meter_sensors
      sorting_weight: 2

    #  Uses the above pulse_meter and adds sensor and calculations for tracking current litres
    total:
      name: 'Town Water - Consumed Calculation'
      id: town_water_consumed_calculation
      unit_of_measurement: "L"
      icon: "mdi:water"
      state_class: "total_increasing"
      device_class: water
      accuracy_decimals: 2
      filters:
        - multiply: ${town_water_litres_per_pulse}  # Each pulse equals 5 liters
    #  Adds the calculation for 'Reading Total'
      on_value:
        then:
          - lambda: |-
              static float previous_town_water_used_litres_value = 0.0;
              float current_town_water_used_litres_value = id(town_water_consumed_calculation).state;
              id(global_town_water_total) += current_town_water_used_litres_value - previous_town_water_used_litres_value;
              previous_town_water_used_litres_value = current_town_water_used_litres_value;
              id(town_water_total).update();
      internal: true


  ################################################################################
  #
  # Custom Component - Water (Consumption) Statistics in Litres
  # These sensors are hidden as the publish their data into the globals, that stores them
  #

  - platform: "water_statistics"
    id: town_water_statistics_component
    total: town_water_total

    water_today:
      name: "Town Water - Today"
      id: town_water_today
      web_server:
        sorting_group_id: group_consumption_town_water
        sorting_weight: 1

#    water_yesterday:
#      name: "Town Water - Yesterday"
#      id: town_water_yesterday
#      web_server:
#        sorting_group_id: group_consumption_town_water
#        sorting_weight: 2

    water_week:
      name: "Town Water - Week"
      id: town_water_week
      web_server:
        sorting_group_id: group_consumption_town_water
        sorting_weight: 3

    water_month:
      name: "Town Water - Month"
      id: town_water_month
      web_server:
        sorting_group_id: group_consumption_town_water
        sorting_weight: 4

    water_year:
      name: "Town Water - Year"
      id: town_water_year
      web_server:
        sorting_group_id: group_consumption_town_water
        sorting_weight: 5

    water_quarter:
      name: "Town Water - Quarter"
      id: town_water_quarter
      web_server:
        sorting_group_id: group_consumption_town_water
        sorting_weight: 5.5


  ################################################################################
  #
  #  Adds the 'Reading Since Reset' that tracks the LIFETIME total of m3
  #
  - platform: template
    name: "Town Water - Total"
    id: town_water_total
    unit_of_measurement: "L"
    device_class: water
    state_class: "total_increasing"
    icon: "mdi:counter"
    accuracy_decimals: 0                              # As water meter only registers every 10L / whole litres
    update_interval: ${water_sensor_update_interval}  # Set interval that updates are sent to HA instance
    lambda: |-
          return id(global_town_water_total);
    web_server:
      sorting_group_id: group_consumption_town_water
      sorting_weight: 6

  ################################################################################
  #
  #  Town Water pricing - bracketed 2-tier cost (Tariff 1 up to the daily
  #  limit averaged over the quarter-to-date, Tariff 2 above it), plus the
  #  separately-tracked annual connection fee pro-rated to a daily/quarter
  #  figure. Usage cost and connection fee are kept as separate sensors,
  #  matching how the two line items appear separately on the actual bill.
  #
  - platform: template
    name: "Town Water - Quarter Cost"
    id: town_water_quarter_cost
    unit_of_measurement: "$"
    device_class: monetary
    accuracy_decimals: 2
    icon: "mdi:cash-multiple"
    update_interval: ${water_sensor_update_interval}
    lambda: |-
      // True bracketed total for quarter-to-date usage (Litres from
      // Town Water - Quarter, converted to kL). Usage-only - excludes the
      // annual connection fee, which is tracked separately below.
      float quarter_kl = id(town_water_quarter).state / 1000.0f;
      int days_elapsed = id(town_water_statistics_component).days_into_quarter();
      if (days_elapsed < 1) days_elapsed = 1;

      float tariff1_rate = id(town_water_tariff1_rate);
      float tariff2_rate = id(town_water_tariff2_rate);
      float daily_limit = id(town_water_tariff1_daily_limit);
      float threshold_kl = daily_limit * days_elapsed;

      float tariff1_kl = quarter_kl;
      if (tariff1_kl > threshold_kl) tariff1_kl = threshold_kl;
      if (tariff1_kl < 0) tariff1_kl = 0;
      float tariff2_kl = quarter_kl - threshold_kl;
      if (tariff2_kl < 0) tariff2_kl = 0;

      return (tariff1_kl * tariff1_rate) + (tariff2_kl * tariff2_rate);
    web_server:
      sorting_group_id: group_utility_cost_sensors
      sorting_weight: 3

  - platform: template
    name: "Town Water - Daily Cost"
    id: town_water_daily_cost
    unit_of_measurement: "$"
    device_class: monetary
    accuracy_decimals: 2
    icon: "mdi:cash"
    update_interval: ${water_sensor_update_interval}
    lambda: |-
      // Bracketed cost of just today's incremental usage - worked out as
      // (bracketed cost of quarter-to-date usage including today) minus
      // (bracketed cost of quarter-to-date usage as it stood at the start
      // of today), so a tariff boundary crossed partway through today is
      // still priced correctly on each side of the split. Usage-only -
      // excludes the connection fee, tracked separately below.
      float quarter_l_now = id(town_water_quarter).state;
      float today_l = id(town_water_today).state;
      float quarter_l_before_today = quarter_l_now - today_l;
      if (quarter_l_before_today < 0) quarter_l_before_today = 0;

      int days_now = id(town_water_statistics_component).days_into_quarter();
      if (days_now < 1) days_now = 1;
      int days_before_today = days_now - 1;

      float tariff1_rate = id(town_water_tariff1_rate);
      float tariff2_rate = id(town_water_tariff2_rate);
      float daily_limit = id(town_water_tariff1_daily_limit);

      auto bracket_cost = [&](float litres, int days) -> float {
        float kl = litres / 1000.0f;
        float threshold_kl = daily_limit * days;
        float t1 = kl;
        if (t1 > threshold_kl) t1 = threshold_kl;
        if (t1 < 0) t1 = 0;
        float t2 = kl - threshold_kl;
        if (t2 < 0) t2 = 0;
        return (t1 * tariff1_rate) + (t2 * tariff2_rate);
      };

      float cost_up_to_today = bracket_cost(quarter_l_now, days_now);
      float cost_up_to_yesterday = bracket_cost(quarter_l_before_today, days_before_today);
      float today_cost = cost_up_to_today - cost_up_to_yesterday;
      if (today_cost < 0) today_cost = 0;
      return today_cost;
    web_server:
      sorting_group_id: group_utility_cost_sensors
      sorting_weight: 4

  - platform: template
    name: "Town Water - Daily Connection Fee"
    id: town_water_daily_connection_fee
    unit_of_measurement: "$"
    device_class: monetary
    accuracy_decimals: 4
    icon: "mdi:cash-minus"
    update_interval: ${water_sensor_update_interval}
    lambda: |-
      return id(town_water_annual_fee) / 365.0f;
    web_server:
      sorting_group_id: group_utility_cost_sensors
      sorting_weight: 5

  - platform: template
    name: "Town Water - Quarter Connection Fee"
    id: town_water_quarter_connection_fee
    unit_of_measurement: "$"
    device_class: monetary
    accuracy_decimals: 2
    icon: "mdi:cash-minus"
    update_interval: ${water_sensor_update_interval}
    lambda: |-
      int days_elapsed = id(town_water_statistics_component).days_into_quarter();
      if (days_elapsed < 1) days_elapsed = 1;
      return (id(town_water_annual_fee) / 365.0f) * days_elapsed;
    web_server:
      sorting_group_id: group_utility_cost_sensors
      sorting_weight: 6

  ################################################################################
  #
  #  Uses the Usage_Tracker custom component to publish duration of last tap OPEN.
  #

  - platform: usage_tracker
    on_off_sensor: town_water_tap_state_sensor

    # This is internal as we use a text_sensor above to reformat the output into days/hours/min/sec.
    last_use:
      name: "Town Water - Last Use Sensor"
      id: town_water_last_use_sensor
      accuracy_decimals: 1
      filters:
        - delta: 0.1         # Only update if change is ≥ 0.1 min
      internal: true

    # Don't want to show this sensor, but the custom_component requires that both sensors are used.
    lifetime_use:
      name: "Town Water - Lifetime Use Duration"
      id: town_water_lifetime_use_sensor
      unit_of_measurement: "min"
      accuracy_decimals: 1
      filters:
        - lambda: |-
            return x / 60.0;
        - delta: 0.1         # Only update if change is ≥ 0.1 min
      web_server:
        sorting_group_id: group_utility_water_meter_sensors
        sorting_weight: 5
      internal: true

################################################################################
